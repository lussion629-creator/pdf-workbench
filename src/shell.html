<style>
/* Layout: a bindery workbench — tool shelf on the home view, then a stage (pages) + side rail (settings) per tool */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --sunk:#e8ebf1; --ink:#151a24; --muted:#5a6273; --line:#d9dde6;
  --accent:#2747d4; --accent-ink:#ffffff; --accent-soft:#e3e8fc; --danger:#c8323f; --ok:#18855f;
  --c-org:#2f5ad6; --c-opt:#1a8a68; --c-to:#c8701e; --c-from:#b4471a; --c-edit:#7a4fd8; --c-sec:#c8323f; --c-ai:#0d8ea4;
  --sheet-shadow:0 1px 2px rgba(20,26,40,.08),0 4px 14px rgba(20,26,40,.06);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --surface:#1a1e28; --sunk:#232836; --ink:#e7eaf1; --muted:#9aa2b4; --line:#2c3240;
  --accent:#8199ff; --accent-ink:#0d1020; --accent-soft:#232c52; --danger:#ff6b76; --ok:#4cc79a;
  --c-org:#7d9bff; --c-opt:#4cc79a; --c-to:#f0a25a; --c-from:#f08a5d; --c-edit:#b394ff; --c-sec:#ff6b76; --c-ai:#4fc8dc;
  --sheet-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1e28; --sunk:#232836; --ink:#e7eaf1; --muted:#9aa2b4; --line:#2c3240;
  --accent:#8199ff; --accent-ink:#0d1020; --accent-soft:#232c52; --danger:#ff6b76; --ok:#4cc79a;
  --c-org:#7d9bff; --c-opt:#4cc79a; --c-to:#f0a25a; --c-from:#f08a5d; --c-edit:#b394ff; --c-sec:#ff6b76; --c-ai:#4fc8dc;
  --sheet-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding-block:18px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em;background:none;border:0;cursor:pointer;padding:0}
.brand-mark{width:26px;height:32px;position:relative;flex:none}
.brand-mark i{position:absolute;inset:0;border-radius:3px;background:var(--surface);border:1.5px solid var(--ink)}
.brand-mark i:nth-child(1){transform:translate(-4px,3px) rotate(-6deg);opacity:.45}
.brand-mark i:nth-child(2){background:var(--accent);border-color:var(--accent)}
.brand-mark i:nth-child(2)::after{content:"";position:absolute;right:-1.5px;top:-1.5px;width:9px;height:9px;background:var(--bg);border-left:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent)}
.top .local{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.top .local b{color:var(--ok);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

/* home */
.hero{display:grid;gap:10px;margin-bottom:22px}
.hero h1{font-size:clamp(26px,4vw,38px);line-height:1.2;letter-spacing:-.02em;margin:0;text-wrap:balance;font-weight:700}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-block:18px 22px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 200px;min-width:0;max-width:280px;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.shelf{display:grid;gap:30px}
.shelf h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;gap:10px;align-items:center}
.shelf h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--cat);transform:translateY(-1px)}
.card .t{font-weight:600;font-size:15.5px;align-self:center}
.card .d{grid-column:1/-1;color:var(--muted);font-size:13.5px;line-height:1.5}
.card .new{font-size:11px;font-weight:600;color:var(--cat);border:1px solid var(--cat);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.sheet{--cat:var(--accent);width:40px;height:48px;position:relative;flex:none;border-radius:4px;background:color-mix(in srgb,var(--cat) 14%,var(--surface));border:1.5px solid var(--cat);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:10.5px;color:var(--cat);letter-spacing:-.02em;overflow:hidden}
.sheet::after{content:"";position:absolute;right:-1.5px;top:-1.5px;width:11px;height:11px;background:var(--surface);border-left:1.5px solid var(--cat);border-bottom:1.5px solid var(--cat);border-bottom-left-radius:3px}
.sheet.big{width:52px;height:62px;font-size:13px}
.card[data-cat=org],.sheet[data-cat=org]{--cat:var(--c-org)} .card[data-cat=opt],.sheet[data-cat=opt]{--cat:var(--c-opt)}
.card[data-cat=to],.sheet[data-cat=to]{--cat:var(--c-to)} .card[data-cat=from],.sheet[data-cat=from]{--cat:var(--c-from)}
.card[data-cat=edit],.sheet[data-cat=edit]{--cat:var(--c-edit)} .card[data-cat=sec],.sheet[data-cat=sec]{--cat:var(--c-sec)}
.card[data-cat=ai],.sheet[data-cat=ai]{--cat:var(--c-ai)}

/* tool view */
.tool-head{display:flex;gap:16px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.tool-head h1{margin:0;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;line-height:1.2}
.tool-head p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.tool-head>div{min-width:0;flex:1}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:14px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;background:var(--sunk);border-radius:14px;padding:18px;min-height:360px;position:relative}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.rail{position:static}}
.rail h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* drop zone */
.drop{border:2px dashed color-mix(in srgb,var(--muted) 45%,transparent);border-radius:12px;padding:44px 20px;display:grid;justify-items:center;gap:12px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-size:18px}
.drop small{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:10px 18px;font-weight:600;cursor:pointer;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-size:15px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 11px;font-size:13.5px;border-radius:7px}
.btn.wide{width:100%;padding-block:13px;font-size:16px}
.btn.danger{background:var(--danger);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* file list */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fcard{background:var(--surface);border-radius:10px;padding:10px;display:grid;gap:8px;box-shadow:var(--sheet-shadow);position:relative;cursor:grab;min-width:0}
.fcard.dragging{opacity:.4}
.fcard .thumb{aspect-ratio:3/4;max-width:100%;background:var(--sunk);border-radius:4px;display:grid;place-items:center;overflow:hidden}
.fcard .thumb img,.fcard .thumb canvas{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line)}
.fcard .nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.fcard .tools{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.ib{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1;color:var(--ink);padding:0}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib svg{width:15px;height:15px}
.addmore{border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;min-height:180px;cursor:pointer;color:var(--muted);background:transparent;font-size:14px}
.stage-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px;color:var(--muted)}
.stage-bar .sp{flex:1}

/* page grid */
.pgroup{margin-bottom:18px}
.pgroup h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.pcard{background:var(--surface);border-radius:8px;padding:8px;display:grid;gap:6px;justify-items:center;box-shadow:var(--sheet-shadow);position:relative;cursor:pointer;user-select:none;border:2px solid transparent;min-width:0}
.pcard .pv{width:100%;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden}
.pcard .pv canvas,.pcard .pv img{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line);transition:transform .2s}
.pcard .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pcard.sel{border-color:var(--accent)}
.pcard.del{opacity:.35}
.pcard.del .pv::after{content:"삭제";position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--danger);font-size:15px}
.pcard .pt{position:absolute;top:4px;right:4px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.pcard:hover .pt,.pcard:focus-within .pt{opacity:1}
@media (hover:none){.pcard .pt{opacity:1}}
.pcard .pt .ib{width:24px;height:24px;font-size:12px}
.pcard .tick{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;color:var(--accent-ink)}
.pcard.sel .tick{background:var(--accent);border-color:var(--accent)}
.pcard.drop-before{box-shadow:-4px 0 0 var(--accent),var(--sheet-shadow)}
.blankpg{background:#fff;width:70%;aspect-ratio:1/1.414;box-shadow:0 0 0 1px var(--line)}

/* fields */
.fld{display:grid;gap:6px}
.fld>label,.fld>.lb{font-size:13.5px;font-weight:600}
.fld .hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14.5px;min-width:0}
textarea.in{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:4px;background:var(--sunk);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 6px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--accent)}
.pos9{display:grid;grid-template-columns:repeat(3,34px);gap:4px}
.pos9 button{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;position:relative}
.pos9 button::after{content:"";position:absolute;width:8px;height:8px;border-radius:2px;background:var(--muted);left:50%;top:50%;transform:translate(-50%,-50%)}
.pos9 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pos9 button[aria-pressed="true"]::after{background:var(--accent)}
.pos9.six{grid-template-rows:34px 34px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px;line-height:1.5}
.note.warn{color:var(--ink);background:color-mix(in srgb,var(--c-to) 16%,var(--surface))}
.rangeval{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}

/* progress & results */
.busy{position:absolute;inset:0;background:color-mix(in srgb,var(--sunk) 88%,transparent);display:grid;place-items:center;border-radius:14px;z-index:20;padding:20px}
.busy .box{background:var(--surface);border-radius:12px;padding:22px;width:min(380px,100%);display:grid;gap:12px;box-shadow:var(--sheet-shadow)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.busy .msg{font-size:14px}
.results{display:grid;gap:16px}
.done-head{display:flex;gap:14px;align-items:center}
.done-head .ok{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.done-head h2{margin:0;font-size:21px}
.done-head p{margin:0;color:var(--muted);font-size:14px}
.outlist{display:grid;gap:8px}
.out{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.out .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.out .sz{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.cmp{font-family:var(--f-mono);font-size:13px}
.cmp b{color:var(--ok)}
.preview-text{background:var(--surface);border-radius:10px;padding:18px;white-space:pre-wrap;font-size:14.5px;line-height:1.7;max-height:540px;overflow:auto;min-width:0;overflow-wrap:anywhere}
.preview-text.md h1,.preview-text.md h2,.preview-text.md h3{margin:.6em 0 .3em;line-height:1.3}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:100;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast{display:flex;gap:12px;align-items:center}.toast-act{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:13px;flex:none}
.err{color:var(--danger);font-size:14px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-radius:8px;padding:10px 12px}

/* editor */
.ed-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface);border-radius:10px;padding:6px;margin-bottom:12px;box-shadow:var(--sheet-shadow)}
.ed-bar .tb{border:0;background:transparent;border-radius:7px;padding:7px 10px;font-size:13.5px;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--ink)}
.ed-bar .tb svg{width:16px;height:16px}
.ed-bar .tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ed-bar .sep{width:1px;height:22px;background:var(--line)}
.ed-nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-family:var(--f-mono);font-size:13px}
.ed-scroll{overflow:auto;max-width:100%;display:grid;justify-content:center;padding:4px}
.ed-page{position:relative;background:#fff;box-shadow:var(--sheet-shadow);touch-action:none}
.ed-page canvas{display:block}
.ed-layer{position:absolute;inset:0}
.obj{position:absolute;cursor:move;outline:1px dashed transparent}
.obj.sel{outline:1.5px solid var(--accent)}
.obj .txt{white-space:pre;line-height:1.25;font-family:"NanumGothicLocal","IBM Plex Sans KR",sans-serif;pointer-events:none}
.obj .txt[contenteditable="true"]{pointer-events:auto;outline:none;cursor:text;min-width:10px}
.obj img{width:100%;height:100%;display:block;pointer-events:none}
.obj svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.obj .h{position:absolute;width:12px;height:12px;right:-7px;bottom:-7px;background:var(--accent);border:2px solid #fff;border-radius:3px;cursor:nwse-resize;display:none}
.obj.sel .h{display:block}
.obj.redact{background:rgba(0,0,0,.85)}
.obj.field{background:rgba(39,71,212,.12);border:1px solid rgba(39,71,212,.7);font-size:11px;color:#2747d4;padding:1px 4px;overflow:hidden;font-family:var(--f-mono)}
.cropbox{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(10,14,25,.45);cursor:move}
.cropbox .h{display:block}
.thumbs-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.thumbs-strip button{flex:none;border:2px solid transparent;border-radius:5px;padding:2px;background:var(--surface);cursor:pointer;position:relative}
.thumbs-strip button[aria-current="true"]{border-color:var(--accent)}
.thumbs-strip canvas{display:block;height:84px;width:auto}
.thumbs-strip .badge{position:absolute;right:3px;bottom:3px;background:var(--accent);color:var(--accent-ink);font-size:10px;border-radius:4px;padding:0 4px;font-family:var(--f-mono)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,10,16,.5);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;width:min(560px,100%);display:grid;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.modal h3{margin:0;font-size:18px}
.sigpad{width:100%;height:200px;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;display:block}
.sigtypes{display:grid;gap:8px}
.sigtypes button{border:1px solid var(--line);background:#fff;color:#111;border-radius:9px;padding:6px 14px;font-size:30px;text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sigtypes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.swatches{display:flex;gap:6px}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}

/* compare */
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.cmpgrid{grid-template-columns:1fr}}
.cmpcol{background:var(--surface);border-radius:10px;padding:14px;min-width:0;font-size:14px;line-height:1.75;max-height:520px;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap}
.cmpcol h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:600;white-space:normal}
del.d{background:color-mix(in srgb,var(--danger) 22%,transparent);text-decoration:line-through;text-decoration-color:var(--danger)}
ins.a{background:color-mix(in srgb,var(--ok) 25%,transparent);text-decoration:none}
.visual-diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.visual-diff figure{margin:0;background:var(--surface);border-radius:10px;padding:10px;display:grid;gap:6px;min-width:0}
.visual-diff canvas{max-width:100%;height:auto;box-shadow:0 0 0 1px var(--line)}
.visual-diff figcaption{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.form-fields{display:grid;gap:10px;max-height:420px;overflow:auto;padding-right:4px}
.foot{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px;display:flex;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@font-face{font-family:"NanumGothicLocal";src:url("fonts/NanumGothic.ttf") format("truetype");font-display:swap}
</style>
