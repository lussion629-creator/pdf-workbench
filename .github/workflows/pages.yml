# main 브랜치에 올릴 때마다 웹 버전을 만들어 GitHub Pages에 배포합니다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 바꾸세요.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: 보안 점검
        run: bash scripts/security_check.sh
      - name: 라이브러리 설치 (설치 스크립트 실행 안 함)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 웹 버전 빌드 (오프라인 번들)
        run: python3 build.py app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist/app}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
